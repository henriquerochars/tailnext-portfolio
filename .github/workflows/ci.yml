# Generated by scripts/agent/ci-workflow.mjs; edit the reviewed registry/generator.
name: CI
run-name: CI source ${{ github.event.pull_request.head.sha || github.sha }}
on:
  pull_request:
  push:
    branches: [final]
  merge_group:
    types: [checks_requested]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CI_SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  CI_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
  NEXT_TELEMETRY_DISABLED: '1'
jobs:
  plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      plan_json: ${{ steps.plan.outputs.plan_json }}
      structure: ${{ steps.plan.outputs.structure }}
      validate: ${{ steps.plan.outputs.validate }}
      validate-macos: ${{ steps.plan.outputs.validate-macos }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - id: plan
        run: node scripts/agent/ci-runner.mjs plan
  structure:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [plan]
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan_json }}
    outputs:
      record_json: ${{ steps.verify.outputs.record_json }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - id: verify
        run: node scripts/agent/ci-runner.mjs run structure
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [plan]
    if: ${{ needs.plan.outputs.validate == 'true' }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan_json }}
    outputs:
      record_json: ${{ steps.verify.outputs.record_json }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install reviewed Yarn launcher
        run: npm install --prefix "$RUNNER_TEMP/harness-yarn" --ignore-scripts --no-audit --no-fund --package-lock=false yarn@1.22.22
      - name: Select exact Yarn launcher
        run: echo "HARNESS_YARN=$RUNNER_TEMP/harness-yarn/node_modules/yarn/bin/yarn.js" >> "$GITHUB_ENV"
      - id: verify
        run: node scripts/agent/ci-runner.mjs run validate
      - name: Collect bounded failure diagnostics
        if: failure()
        run: node scripts/agent/artifacts.mjs "$RUNNER_TEMP/harness-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: validate-diagnostics
          path: ${{ runner.temp }}/harness-artifacts/
          retention-days: 3
          if-no-files-found: warn
  validate-macos:
    runs-on: macos-15
    timeout-minutes: 25
    needs: [plan]
    if: ${{ needs.plan.outputs.validate-macos == 'true' }}
    env:
      CI_PLAN: ${{ needs.plan.outputs.plan_json }}
    outputs:
      record_json: ${{ steps.verify.outputs.record_json }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Install reviewed Yarn launcher
        run: npm install --prefix "$RUNNER_TEMP/harness-yarn" --ignore-scripts --no-audit --no-fund --package-lock=false yarn@1.22.22
      - name: Select exact Yarn launcher
        run: echo "HARNESS_YARN=$RUNNER_TEMP/harness-yarn/node_modules/yarn/bin/yarn.js" >> "$GITHUB_ENV"
      - id: verify
        run: node scripts/agent/ci-runner.mjs run validate-macos
      - name: Collect bounded failure diagnostics
        if: failure()
        run: node scripts/agent/artifacts.mjs "$RUNNER_TEMP/harness-artifacts"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: failure()
        with:
          name: validate-macos-diagnostics
          path: ${{ runner.temp }}/harness-artifacts/
          retention-days: 3
          if-no-files-found: warn
  required-summary:
    name: required-summary
    if: ${{ always() }}
    needs: [plan, structure, validate, validate-macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      CI_NEEDS: ${{ toJSON(needs) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24.21.0'
          package-manager-cache: false
      - name: Evaluate complete exact-revision evidence
        run: node scripts/agent/ci-runner.mjs summary
