name: Upgrade Next 16 validation

on:
  push:
    branches:
      - chore/issue-4-next-16

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Refresh lockfile
        run: yarn install

      - name: Type check
        run: yarn typecheck

      - name: Lint
        run: yarn lint

      - name: Build
        run: yarn build

      - name: Commit refreshed lockfile
        run: |
          if git diff --quiet -- yarn.lock; then
            echo "yarn.lock is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add yarn.lock
          git commit -m "chore: refresh yarn lockfile for Next.js 16"
          git push
